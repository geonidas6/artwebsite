<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Œuvre d'art</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="gallery" role="main">
    <canvas id="artwork" role="img" aria-label="Œuvre d'art en cours d'affichage" aria-busy="true"></canvas>

    <section class="state state-loading visible" id="state-loading" aria-live="polite" aria-label="Chargement de l'œuvre">
      <div class="state-content">
        <svg role="img" aria-label="Icône de chargement" focusable="false" width="48" height="48" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <title>Chargement</title>
          <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" fill="none" stroke-dasharray="31.4 31.4" stroke-dashoffset="0">
            <animate attributeName="stroke-dashoffset" values="31.4;0" dur="1s" repeatCount="indefinite"/>
          </circle>
        </svg>
        <div class="skeleton" aria-hidden="true"></div>
      </div>
    </section>

    <section class="state state-error hidden" id="state-error" aria-live="assertive" aria-label="Erreur de chargement">
      <div class="state-content">
        <svg role="img" aria-label="Icône d'erreur" focusable="false" width="48" height="48" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <title>Erreur</title>
          <circle cx="12" cy="12" r="10" fill="var(--color-error)"/>
          <line x1="15" y1="9" x2="9" y2="15" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
          <line x1="9" y1="9" x2="15" y2="15" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <p class="state-message">Impossible de charger l'œuvre</p>
      </div>
    </section>

    <section class="state state-empty hidden" id="state-empty" aria-live="polite" aria-label="Aucune œuvre disponible">
      <div class="state-content">
        <svg role="img" aria-label="Icône information" focusable="false" width="48" height="48" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <title>Aucune œuvre</title>
          <circle cx="12" cy="12" r="10" fill="currentColor"/>
          <line x1="12" y1="16" x2="12" y2="12" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
          <circle cx="12" cy="8" r="1" fill="#fff"/>
        </svg>
        <p class="state-message">Aucune œuvre disponible</p>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true" aria-hidden="true"></div>

  <script src="app.js"></script>
</body>
</html>
